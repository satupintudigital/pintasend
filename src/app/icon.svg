<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#09090b"/>
  <!-- Speech bubble outline (gradient cyan → blue) -->
  <rect x="8" y="11" width="37" height="31" rx="9" fill="none" stroke="url(#bubble)" stroke-width="3.4"/>
  <path d="M38 39 L44 45 L46 36 Z" fill="url(#bubble)"/>
  <!-- Line chart: nodes naik ke kanan, node terakhir keluar dari bubble -->
  <polyline
    points="14,33 20,25 26,29 31,19 37,24 42,9"
    fill="none"
    stroke="#22d3ee"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="14" cy="33" r="2.5" fill="#22d3ee"/>
  <circle cx="20" cy="25" r="2.5" fill="#22d3ee"/>
  <circle cx="26" cy="29" r="2.5" fill="#22d3ee"/>
  <circle cx="31" cy="19" r="2.5" fill="#22d3ee"/>
  <circle cx="37" cy="24" r="2.5" fill="#22d3ee"/>
  <circle cx="42" cy="9" r="2.9" fill="#22d3ee"/>
</svg>
