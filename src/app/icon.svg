<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Tile putih wajib: mark-nya navy gelap, jadi tanpa tile transparan
       mark hilang di tab browser dark-mode. Navy di atas putih = kontras
       tinggi di light maupun dark. -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <!-- Bounding box mark di koordinat path: x 60..255.5 (w 195.5), y 18..244 (h 226).
       Skala 0.2549 -> tinggi 57.6 (90% kanvas), lebar 49.8, padding top/bottom 3.2 (5%),
       kiri/kanan 7.1. Mark stay di dalam rounded corner (rx 14 -> sudut mulai di x 5.09). -->
  <g transform="translate(-8.205 -1.388) scale(0.2549)">
    <!-- Portal pillar -->
    <path d="M 60 230 L 60 85 C 60 40, 95 18, 140 18 C 170 18, 185 30, 185 45 C 185 58, 172 68, 155 68 C 125 68, 102 85, 102 115 L 102 230 C 102 238, 95 244, 81 244 C 67 244, 60 238, 60 230 Z" fill="#0f172a"/>
    <!-- Dispatch arrow -->
    <path d="M 125 78 C 132 78, 139 82, 144 87 L 226 142 C 236 148, 236 156, 226 162 L 144 217 C 139 221, 131 223, 126 218 C 120 213, 120 205, 124 198 L 165 155 C 168 153, 168 151, 165 149 L 124 106 C 119 100, 119 90, 124 83 C 124 80, 125 78, 125 78 Z" fill="url(#markGrad)"/>
    <!-- AI telemetry dot -->
    <circle cx="248" cy="152" r="7.5" fill="#06b6d4"/>
  </g>
</svg>